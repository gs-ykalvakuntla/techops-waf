name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'layers/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ── Detect which layers changed in this PR ──────────────────────────────────
  detect-layers:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.changed.outputs.layers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD \
            | grep '^layers/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "layers=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed layers: $CHANGED"

  # ── Run plan for each changed layer ─────────────────────────────────────────
  plan:
    needs: detect-layers
    if: needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layer: ${{ fromJson(needs.detect-layers.outputs.layers) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      # Map layer prefix → AWS account role + region
      - name: Resolve AWS role for layer
        id: aws-role
        run: |
          case "${{ matrix.layer }}" in
            us1-*|00-bootstrap-us1)
              echo "role=${{ secrets.US1_WAF_AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
              echo "region=us-east-1" >> $GITHUB_OUTPUT ;;
            us2-*|00-bootstrap-us2)
              echo "role=${{ secrets.US2_WAF_AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
              echo "region=us-west-2" >> $GITHUB_OUTPUT ;;
            eu-*|00-bootstrap-eu)
              echo "role=${{ secrets.EU_WAF_AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
              echo "region=eu-central-1" >> $GITHUB_OUTPUT ;;
            *)
              echo "Unknown layer: ${{ matrix.layer }}"
              exit 1 ;;
          esac

      # Skip OIDC if secrets not yet configured (initial repo setup)
      - name: Check secrets configured
        id: secrets-check
        run: |
          if [ -z "${{ steps.aws-role.outputs.role }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "WARNING: AWS role secret not set for ${{ matrix.layer }} — skipping plan"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.secrets-check.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role }}
          aws-region:     ${{ steps.aws-role.outputs.region }}

      - name: Setup Terraform
        if: steps.secrets-check.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: layers/${{ matrix.layer }}
        run: terraform init

      - name: Terraform Validate
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: layers/${{ matrix.layer }}
        run: terraform validate

      - name: Terraform Plan
        if: steps.secrets-check.outputs.configured == 'true'
        id: plan
        working-directory: layers/${{ matrix.layer }}
        run: terraform plan -lock=false -no-color 2>&1 | tee plan_output.txt

      # Post plan output as PR comment
      - name: Post plan to PR
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('layers/${{ matrix.layer }}/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... [truncated]'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — \`${{ matrix.layer }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      # Post a note if secrets not configured
      - name: Post secrets-not-configured note to PR
        if: steps.secrets-check.outputs.configured == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — \`${{ matrix.layer }}\`\n> ⚠️ Skipped — AWS role secret not configured yet.\n> Add \`US1_WAF_AWS_ROLE_ARN\`, \`US2_WAF_AWS_ROLE_ARN\`, \`EU_WAF_AWS_ROLE_ARN\` to repository secrets after running bootstrap.`
            });
