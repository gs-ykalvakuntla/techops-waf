name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'layers/**'

permissions:
  id-token: write      # required for OIDC token request
  contents: read
  pull-requests: write # required to post plan output as PR comment

jobs:
  # ── Step 1: Detect which layers changed in this PR ──────────────────────────
  detect-layers:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.changed.outputs.layers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD \
            | grep '^layers/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "layers=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed layers: $CHANGED"

  # ── Step 2: Run plan for each changed layer ─────────────────────────────────
  plan:
    needs: detect-layers
    if: needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layer: ${{ fromJson(needs.detect-layers.outputs.layers) }}
      fail-fast: false  # run all layers even if one fails

    steps:
      - uses: actions/checkout@v4

      # Map layer name → AWS account role + region
      # us1-* → US1 account (895034595272), us-east-1
      # us2-* → US2 account (180146257873), us-west-2
      # eu-*  → EU  account (665168952601), eu-central-1
      - name: Resolve AWS role for layer
        id: aws-role
        run: |
          case "${{ matrix.layer }}" in
            us1-*|00-bootstrap-us1)
              echo "role=${{ secrets.US1_WAF_AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
              echo "region=us-east-1" >> $GITHUB_OUTPUT ;;
            us2-*|00-bootstrap-us2)
              echo "role=${{ secrets.US2_WAF_AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
              echo "region=us-west-2" >> $GITHUB_OUTPUT ;;
            eu-*|00-bootstrap-eu)
              echo "role=${{ secrets.EU_WAF_AWS_ROLE_ARN }}" >> $GITHUB_OUTPUT
              echo "region=eu-central-1" >> $GITHUB_OUTPUT ;;
            *)
              echo "Unknown layer prefix: ${{ matrix.layer }}"
              exit 1 ;;
          esac

      # OIDC authentication — no AWS keys stored in GitHub
      # GitHub Actions requests a short-lived token, AWS validates it
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role }}
          aws-region:     ${{ steps.aws-role.outputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        working-directory: layers/${{ matrix.layer }}
        run: terraform init

      - name: Terraform Validate
        working-directory: layers/${{ matrix.layer }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: layers/${{ matrix.layer }}
        run: |
          terraform plan -lock=false -no-color 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Post plan output as a PR comment for review
      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('layers/${{ matrix.layer }}/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... [truncated]'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — \`${{ matrix.layer }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });
